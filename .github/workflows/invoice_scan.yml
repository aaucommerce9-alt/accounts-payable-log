name: Invoice Scan

on:
  push:
    paths:
      - "invoices/incoming/**"
  workflow_dispatch:
    inputs:
      channel:
        description: "Fulfillment channel"
        required: false
        default: "FBA"
        type: choice
        options: [FBA, FBM]

permissions:
  contents: write

# Only one scan runs at a time per branch — two overlapping runs would both
# draw from the same Keepa token budget (starving each other) and race to
# push their results, causing exactly the git conflict this queuing avoids.
concurrency:
  group: invoice-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secret
        run: echo "KEEPA_API_KEY=${{ secrets.KEEPA_API_KEY }}" > .env

      - name: Scan new invoices
        run: |
          mkdir -p invoices/results invoices/incoming/.processed
          shopt -s nullglob
          for f in invoices/incoming/*.csv invoices/incoming/*.xlsx invoices/incoming/*.xls invoices/incoming/*.pdf; do
            name=$(basename "$f")
            base="${name%.*}"
            echo "Scanning $f"
            python scan_invoice.py "$f" \
              --channel "${{ github.event.inputs.channel || 'FBA' }}" \
              --csv-out "invoices/results/${base}_result.csv"
            # Move out of incoming/ so re-runs (e.g. workflow_dispatch) don't
            # re-scan and re-spend Keepa tokens on files already processed.
            git mv "$f" "invoices/incoming/.processed/$name"
          done

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add invoices/results invoices/incoming
          git diff --staged --quiet || git commit -m "Invoice scan results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin "${{ github.ref_name }}"
          git push

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-scan-results-${{ github.run_id }}
          path: invoices/results
          retention-days: 30
