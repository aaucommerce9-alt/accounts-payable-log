name: Deep-dive Scan

on:
  push:
    paths:
      - "invoices/deepdive_requests/**"

permissions:
  contents: write

# Same reasoning as Invoice Scan — one run at a time per branch so it
# doesn't race a concurrent invoice scan for the same Keepa token budget
# or collide on the git push.
concurrency:
  group: invoice-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deepdive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secret
        run: echo "KEEPA_API_KEY=${{ secrets.KEEPA_API_KEY }}" > .env

      - name: Deep-dive new requests
        run: |
          mkdir -p invoices/deepdive_results invoices/deepdive_requests/.processed
          shopt -s nullglob
          for f in invoices/deepdive_requests/*.csv; do
            name=$(basename "$f" .csv)
            echo "Deep-diving $f"
            python deepdive_skus.py "$f" --csv-out "invoices/deepdive_results/${name}_deepdive.csv"
            git mv "$f" "invoices/deepdive_requests/.processed/$(basename "$f")"
          done

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add invoices/deepdive_results invoices/deepdive_requests
          git diff --staged --quiet || git commit -m "Deep-dive scan results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin "${{ github.ref_name }}"
          git push

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepdive-results-${{ github.run_id }}
          path: invoices/deepdive_results
          retention-days: 30
